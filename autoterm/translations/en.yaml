configuration:
  panel_port:
    name: Panel port
    description: >-
      Serial device wired to the comfort panel leg of the inline proxy
      (dev03 side -- see docs/PROTOCOL.md in the main repo). Verify by
      content, not by devnode number: USB-serial adapters can re-enumerate.
  heater_port:
    name: Heater port
    description: >-
      Serial device wired to the heater leg of the inline proxy (dev04
      side). Commands are injected out this port.
  baud:
    name: Baud rate
    description: UART baud rate. 2400 8N1 confirmed on the reference hardware.
  autodiscover_ports:
    name: Autodiscover panel/heater ports
    description: >-
      On startup, probe every /dev/ttyUSB*//dev/ttyACM* device to find which
      is wired to the panel and which to the heater, and save the result
      over panel_port/heater_port. Sends only the non-actuating status
      query, never start/stop. Leave off unless you've just rewired/replugged
      the USB-serial adapter -- see DOCS.md.
  preheat_default_minutes:
    name: Default preheat duration (minutes)
    description: Initial value of the Preheat duration number entity, before it's changed from Home Assistant.
  auto_target_default:
    name: Default auto-thermostat target (°C)
    description: Initial target temperature for the software auto-thermostat climate entity.
  prevent_freezing_target_default:
    name: Default frost-protection floor (°C)
    description: >-
      Initial value of the Prevent freezing target number entity (0-10°C).
      Live-togglable/adjustable from Home Assistant afterward -- see
      DOCS.md. Starts the heater whenever cabin temperature reaches this
      floor, regardless of the auto-thermostat's own state or a prior
      manual Stop.
  mqtt_host:
    name: MQTT host (fallback)
    description: Only used if no MQTT service is discovered automatically (e.g. no Mosquitto app installed).
  mqtt_port:
    name: MQTT port (fallback)
    description: Only used if no MQTT service is discovered automatically.
  mqtt_username:
    name: MQTT username (fallback)
    description: Only used if no MQTT service is discovered automatically.
  mqtt_password:
    name: MQTT password (fallback)
    description: Only used if no MQTT service is discovered automatically.
  debug_mode_default:
    name: Debug mode default
    description: >-
      Whether the extended-telemetry probe (vendor "PUBR0" handshake) is
      sent on startup. Live-togglable from Home Assistant afterward -- read
      DOCS.md before enabling, it's unconfirmed-safe with the physical
      panel also on the bus.
  debug_interval_seconds_default:
    name: Debug probe interval default (seconds)
    description: Initial value of the Debug probe interval number entity.
  capture_log_default:
    name: Capture log default
    description: Whether the raw traffic capture log starts on on startup.
  capture_log_retention_hours:
    name: Capture log retention (hours)
    description: >-
      How long the raw traffic capture log under /config/autoterm_debug
      keeps rolling before old files are pruned -- it never stops writing
      regardless of size, unlike a fixed byte cap.
  heater_profile:
    name: Heater profile (extended telemetry)
    description: >-
      Which heater model's extended-frame field formulas/state table/fault
      table to use for decoding the 58-byte extended telemetry frame, read
      from the vendor diagnostic tool's own per-model data files. ONLY
      autoterm_flow_5 has been checked against real hardware -- every
      other option is untested: unverified byte offsets, and it's not
      even confirmed the extended-telemetry mechanism (PUBR0 handshake,
      dev02/type01 frame) works the same way on that model at all. See
      DOCS.md and docs/PROTOCOL.md before selecting anything else.
  external_temp_sensor_entity:
    name: External temperature sensor entity ID
    description: >-
      Optional. entity_id of an existing Home Assistant sensor (e.g.
      sensor.lacrosse_bedroom_temperature -- find it under Developer Tools
      > States) to use for Auto thermostat/Prevent freezing instead of the
      panel's own cabin-temp report. Requires homeassistant_api access
      (already granted by this app) and polls that entity's state every
      15s. Leave blank to keep using the panel's own sensor. See DOCS.md.
